name: var-analytics
x-db-environment: &db-environment
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_env.py first}
  DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?missing owner password}
  APP_READER_PASSWORD: ${APP_READER_PASSWORD:?missing reader password}
  APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?missing admin password}
x-db: &db
  image: postgres:16-bookworm
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 20
services:
  db:
    <<: *db
    environment:
      <<: *db-environment
      POSTGRES_DB: var_analytics
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/001_roles.sh:/docker-entrypoint-initdb.d/001_roles.sh:ro
  db-test:
    <<: *db
    profiles: ["test"]
    restart: "no"
    environment:
      <<: *db-environment
      POSTGRES_DB: var_analytics_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./docker/001_roles.sh:/docker-entrypoint-initdb.d/001_roles.sh:ro
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      READER_DATABASE_URL: postgresql+psycopg://app_reader:${APP_READER_PASSWORD}@db:5432/var_analytics
      ADMIN_DATABASE_URL: postgresql+psycopg://app_admin:${APP_ADMIN_PASSWORD}@db:5432/var_analytics
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?missing administrator hash}
    ports: ["127.0.0.1:8501:8501"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  maintenance:
    build: .
    profiles: ["maintenance"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      OWNER_DATABASE_URL: postgresql+psycopg://db_owner:${DB_OWNER_PASSWORD}@db:5432/var_analytics
      ADMIN_DATABASE_URL: postgresql+psycopg://app_admin:${APP_ADMIN_PASSWORD}@db:5432/var_analytics
    entrypoint: ["python", "-m", "var_analytics.cli"]
  mongodb:
    image: mongo:7.0-jammy
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: var_nosql
    volumes:
      - mongodata:/data/db
volumes:
  pgdata:
  mongodata:
