[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "var-decision-analytics"
version = "0.1.0"
description = "Source-backed referee and VAR decision analytics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "streamlit>=1.45,<2",
  "plotly>=6,<7",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "pypdf>=5,<7", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/var_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated PostgreSQL 16 test service"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
